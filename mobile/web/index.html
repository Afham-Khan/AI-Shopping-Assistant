<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Zelora is an AI shopping assistant: ask Zel in plain words, snap a photo to find it, compare products and build bundles under budget.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#EEF1FB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B1020" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Zelora">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon (generated by tool/generate_app_icons.dart) -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png"/>

  <title>Zelora — AI Shopping Assistant</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* the same soft wash the app paints, so there is no flash before it boots */
    html, body {
      margin: 0;
      height: 100%;
      background: #EEF1FB linear-gradient(180deg, #F3F5FD 0%, #EEF1FB 42%, #E6EAF8 100%) fixed;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
