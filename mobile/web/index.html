<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Zelora is an AI shopping assistant: ask Zel in plain words, snap a photo to find it, compare products and build bundles under budget.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#EEF1FB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B1020" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Zelora">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon (generated by tool/generate_app_icons.dart) -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png"/>

  <title>Zelora — AI Shopping Assistant</title>
  <link rel="manifest" href="manifest.json">
  <!-- CanvasKit and the app fonts come from Google's CDN: open that connection while the page parses -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    /* the same soft wash the app paints, so there is no flash before it boots */
    html, body {
      margin: 0;
      height: 100%;
      background: #EEF1FB linear-gradient(180deg, #F3F5FD 0%, #EEF1FB 42%, #E6EAF8 100%) fixed;
    }
    /* pre-Flutter loading screen: pure CSS, system fonts only, removed on Flutter's first frame (script below) */
    #zl-boot {
      position: fixed; inset: 0; z-index: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity .25s ease;
    }
    #zl-boot svg { width: 84px; height: 84px; border-radius: 26px; box-shadow: 0 10px 28px rgba(37,99,235,.28); animation: zl-bob 1.3s ease-in-out infinite alternate; }
    #zl-boot p { display: flex; gap: 8px; margin: 30px 0 0; }
    #zl-boot i { width: 8px; height: 8px; border-radius: 50%; background: #2563EB; opacity: .25; animation: zl-dot 1.2s ease-in-out infinite; }
    #zl-boot i:nth-child(2) { animation-delay: .2s; }
    #zl-boot i:nth-child(3) { animation-delay: .4s; }
    @keyframes zl-bob { from { transform: translateY(5px); } to { transform: translateY(-7px); } }
    @keyframes zl-dot { 0%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1.15); } }
    @media (prefers-reduced-motion: reduce) { #zl-boot svg, #zl-boot i { animation: none; } #zl-boot i { opacity: .6; } }
  </style>
</head>
<body>
  <div id="zl-boot" role="status" aria-label="Loading Zelora">
    <!-- the Z-bag mark, same geometry as ZeloraMarkPainter (lib/core/widgets/app_logo.dart) -->
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <defs><linearGradient id="zl-g" x2="0" y2="1"><stop offset="0" stop-color="#3B73ED"/><stop offset="1" stop-color="#245FE2"/></linearGradient></defs>
      <rect width="100" height="100" rx="30" fill="url(#zl-g)"/>
      <path d="M30 38H70V47.5L46.5 68.5H70V78H30V68.5L53.5 47.5H30Z" fill="#fff" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
      <path d="M38.5 38V35a11.5 11.5 0 0 1 23 0V38" fill="none" stroke="#fff" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <p aria-hidden="true"><i></i><i></i><i></i></p>
  </div>
  <script>
    // Flutter fires this once it has painted its first frame; the app's own wash then covers the page
    (function () {
      var boot = document.getElementById('zl-boot');
      function done() {
        if (!boot) return;
        var el = boot; boot = null;
        el.style.opacity = 0;
        setTimeout(function () { el.remove(); }, 300);
      }
      window.addEventListener('flutter-first-frame', done);
      setTimeout(done, 60000); // never leave it behind if the app fails to start
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
